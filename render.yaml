services:
  # Gubera Vasal Backend Web Service
  - type: web
    name: gubera-vasal-api
    runtime: node
    plan: free
    region: singapore # or oregon / frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set in Render Dashboard
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_SECRET_KEY
        generateValue: true
